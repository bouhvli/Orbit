<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Orbit — your personal work command center. Works offline." />

    <!-- Safari tints its toolbars from this, and reads it before the app boots,
         so the inline script below fixes it up front. A single tag (not
         media-scoped) because the in-app theme can differ from the OS. -->
    <meta name="theme-color" content="#f7f4ee" />
    <script>
      // Resolve the theme before first paint: stops Safari tinting its chrome
      // light behind a dark app, and removes the flash of the wrong theme.
      ;(function () {
        try {
          var saved = localStorage.getItem('orbit:resolved-theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#121116' : '#f7f4ee')
        } catch (e) {
          /* private mode, or no storage — the app corrects itself on boot */
        }
      })()
    </script>

    <!-- installed-app behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Orbit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
